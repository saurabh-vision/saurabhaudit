<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <title>ClipVault Verification Checklist</title>
  <desc>Diagram showing verification steps for ClipVault APK permissions, signing, debug state, backup flags, and dependency checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
  <!-- Background -->
  <rect width="800" height="480" fill="#ffffff" />

  <!-- Main APK Box (Left Top) -->
  <rect x="40" y="110" width="240" height="85" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
  <text x="160" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ClipVault-release.apk</text>
  <text x="160" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">or installed package</text>

  <!-- Side In-App Box (Left Bottom) -->
  <rect x="40" y="280" width="240" height="95" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
  <text x="160" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">In-app: Verify it yourself</text>
  <text x="160" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">Settings &gt; Tools &gt;</text>
  <text x="160" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#0f172a" text-anchor="middle">Verify it yourself</text>

  <!-- Checks (Right column) -->
  <!-- Check 1 -->
  <rect x="370" y="25" width="390" height="65" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
  <text x="390" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">1. INTERNET not declared</text>
  <text x="390" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569">dumpsys / aapt confirms 0 socket access</text>

  <!-- Check 2 -->
  <rect x="370" y="110" width="390" height="65" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
  <text x="390" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">2. Signing certificate</text>
  <text x="390" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569">apksigner verify --print-certs</text>

  <!-- Check 3 -->
  <rect x="370" y="195" width="390" height="65" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
  <text x="390" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">3. debuggable false</text>
  <text x="390" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569">aapt dump badging debuggable flag absent</text>

  <!-- Check 4 -->
  <rect x="370" y="280" width="390" height="65" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
  <text x="390" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">4. allowBackup false</text>
  <text x="390" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569">aapt2 xmltree blocks cloud backup</text>

  <!-- Check 5 -->
  <rect x="370" y="365" width="390" height="65" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
  <text x="390" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">5. No tracker dependencies</text>
  <text x="390" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569">./gradlew checkNoTrackerDependencies</text>

  <!-- Connecting Lines from Left to Right -->
  <path d="M 280 140 L 320 140 L 320 57 L 360 57" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 280 145 L 360 145" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 280 160 L 320 160 L 320 227 L 360 227" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 280 170 L 310 170 L 310 312 L 360 312" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 280 325 L 310 325 L 310 397 L 360 397" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
</svg>

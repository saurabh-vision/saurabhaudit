<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Inner Ambient Glow -->
  <circle cx="100" cy="70" r="48" fill="#38bdf8" opacity="0.12" />

  <!-- Stylized Avatar Silhouette -->
  <!-- Head -->
  <circle cx="100" cy="78" r="32" fill="#f8fafc" />

  <!-- Stylized Hair & Headphones -->
  <path d="M 68 76 C 68 52, 132 52, 132 76 C 132 60, 68 60, 68 76 Z" fill="#0f172a" opacity="0.9" />
  <!-- Modern Tech Headphones band -->
  <path d="M 64 80 C 64 50, 136 50, 136 80" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" />
  <!-- Ear cups -->
  <rect x="60" y="72" width="8" height="18" rx="4" fill="#38bdf8" />
  <rect x="132" y="72" width="8" height="18" rx="4" fill="#38bdf8" />

  <!-- Body / Shoulders -->
  <path d="M 44 162 C 44 126, 70 120, 100 120 C 130 120, 156 126, 156 162 C 140 178, 60 178, 44 162 Z" fill="#f8fafc" />
  <!-- Jacket / Collar accent -->
  <path d="M 82 122 L 100 148 L 118 122" fill="#38bdf8" opacity="0.9" />

  <!-- Monogram S Badge in Corner -->
  <circle cx="150" cy="150" r="22" fill="#0284c7" stroke="#0f172a" stroke-width="3" />
  <text x="150" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
</svg>
